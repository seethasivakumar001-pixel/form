<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Bootstrap Form</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <style>
    body {
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
/* asdsad */
    .form-card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      padding: 45px 30px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
      background-image: linear-gradient(180deg, rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      color: #f8fafc;
    }

    .form-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(16, 185, 129, 0.2));
      pointer-events: none;
    }

    .form-title {
      position: relative;
      text-align: center;
      margin-bottom: 28px;
      font-weight: 700;
      color: #eff6ff;
    }

    .form-label {
      color: #dbeafe;
      font-weight: 600;
    }

    .form-control {
      border-radius: 14px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #111827;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .form-control:focus {
      border-color: rgba(59, 130, 246, 0.75);
      box-shadow: 0 0 0 0.15rem rgba(59, 130, 246, 0.18);
    }

    .input-group-text {
      border-radius: 14px 0 0 14px;
      background: rgba(79, 70, 229, 0.85);
      color: white;
      border: 1px solid rgba(79, 70, 229, 0.9);
    }

    .btn-custom {
      background: #6366f1;
      color: white;
      border-radius: 14px;
      padding: 14px;
      font-weight: 700;
      transition: transform 0.2s ease, background-color 0.2s ease;
      border: none;
    }

    .btn-custom:hover {
      background: #3730a3;
      transform: scale(1.02);
    }

    @media (max-width: 576px) {
      .form-card {
        padding: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2 class="form-title">Contact Form</h2>

    <form>
      
      <!-- Name -->
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-person-fill"></i>
          </span>
          <input type="text" class="form-control" placeholder="Enter your name">
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope-fill"></i>
          </span>
          <input type="email" class="form-control" placeholder="Enter your email">
        </div>
      </div>

      <!-- Phone -->
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-telephone-fill"></i>
          </span>
          <input type="tel" class="form-control" placeholder="Enter your phone number">
        </div>
      </div>

      <!-- Message -->
      <div class="mb-4">
        <label class="form-label">Message</label>
        <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
      </div>

      <!-- Button -->
      <div class="d-grid">
        <button type="submit" class="btn btn-custom">
          Submit
        </button>
      </div>

    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
